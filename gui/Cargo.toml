[package]
name = "screentime-app"
description = "Screentime desktop app (iced)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "screentime-app"
path = "src/main.rs"

[dependencies]
screentime-core.workspace = true
chrono.workspace = true
# Renderer: tiny-skia (CPU) on purpose. Measured on this machine with the
# window open: tiny-skia 26 MB working set / 8 MB private, wgpu (RTX 4060)
# 195 MB / 244 MB, equally crisp at 125/150/200 %. A tray app that is open all
# day should not hold ~200 MB or wake the discrete GPU to draw a few bars, and
# it only repaints on input or every 30 s. Re-enable "wgpu" to compare again.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "thread-pool", "canvas", "image-without-codecs"] }
tray-icon = { version = "0.26", default-features = false }

[build-dependencies]
embed-resource = "3"
